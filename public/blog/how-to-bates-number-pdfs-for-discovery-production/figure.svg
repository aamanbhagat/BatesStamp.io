<svg xmlns="http://www.w3.org/2000/svg" width="920" height="368" viewBox="0 0 920 368" role="img">
  <rect width="920" height="368" fill="#ffffff"/>
  <text x="40" y="44" font-family="system-ui,Segoe UI,Arial" font-size="24" font-weight="700" fill="#052e2b">Max Pages per Bates Number Digit Count</text>
  <line x1="40" y1="304" x2="880" y2="304" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="40.0" y="302.0" width="262.7" height="2" rx="6" fill="#10b981"/>
    <text x="171.3" y="292.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="20" font-weight="700" fill="#052e2b">1M p</text>
    <text x="171.3" y="332.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="17" fill="#475569">6 digits</text>
    <rect x="328.7" y="282.0" width="262.7" height="22" rx="6" fill="#10b981"/>
    <text x="460.0" y="272.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="20" font-weight="700" fill="#052e2b">10M p</text>
    <text x="460.0" y="332.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="17" fill="#475569">7 digits</text>
    <rect x="617.3" y="84.0" width="262.7" height="220" rx="6" fill="#10b981"/>
    <text x="748.7" y="74.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="20" font-weight="700" fill="#052e2b">100M p</text>
    <text x="748.7" y="332.0" text-anchor="middle" font-family="system-ui,Segoe UI,Arial" font-size="17" fill="#475569">8 digits</text>
</svg>